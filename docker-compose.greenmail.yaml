services:
  greenmail:
    image: greenmail/standalone:latest
    ports:
      - "3993:3993"
      - "3025:3025"
    environment:
      GREENMAIL_ADDITIONAL_OPTS: -Dgreenmail.verbose
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/3025 && exec 4<>/dev/tcp/127.0.0.1/3993",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - mailassist

  seed:
    build: ./seed
    depends_on:
      greenmail:
        condition: service_healthy
    environment:
      SMTP_HOST: greenmail
      SMTP_PORT: "3025"
      SMTP_USER: test@localhost
      SMTP_PASS: test123
      SEED_DATASET: ${SEED_DATASET:-default}
    volumes:
      - ./seed/datasets:/datasets
    networks:
      - mailassist

  rag-microservice:
    depends_on:
      greenmail:
        condition: service_started
    environment:
      IMAP_TLS_REJECT_UNAUTHORIZED: "false"
